<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Panda Brigade</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-image: url('1000006851.jpg');
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', sans-serif;
    }

    .smiley {
      font-size: 100px;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }
    

    .balloon-text {
      font-size: 60px;
      font-weight: 800;
      color: #ffdd59;
      -webkit-text-stroke: 3px #d63031;
      text-shadow:
        3px 3px 0 #d63031,
        6px 6px 0 #b71540,
        8px 8px 10px rgba(0,0,0,0.4);
      text-align: center;
      margin: 5px 0;
    }

    .subtext {
      font-size: 28px;
      font-weight: 800;
      color: #74b9ff;
      -webkit-text-stroke: 2px #0984e3;
      text-shadow:
        2px 2px 0 #0984e3,
        4px 4px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="smiley">😄</div>

 

  <div class="balloon-text">Hello World</div>
  <div class="subtext">Panda Brigade — under construction</div>
</body>
</html>
